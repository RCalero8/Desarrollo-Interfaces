<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-danger sticky-top shadow-sm">
        <div id="container">
            <a href="#" class="navbar-brand fw bold">
                Pokédex
            </a>
        </div>
    </nav>
    <main class="container py-4">
        <h1 class="h3 mb-3">Lista de Pokemon</h1>
         <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
      <div class="col">
        <div class="card poke-card h-100 shadow-sm">
          <div class="poke-img-wrap text-center">
            <img src="img/1.png" alt="Bulbasaur">
          </div>
          <div class="card-body text-center p-2 p-sm-3">
            <div class="poke-num">#001</div>
            <h2 class="h6 mb-2">
              <a href="DETALLES/detalle-BULBASUR.html" class="stretched-link text-decoration-none text-dark">Bulbasaur</a>
            </h2>
            <div class="d-flex justify-content-center flex-wrap gap-1"><span class="badge badge-tipo tipo-planta">planta</span><span class="badge badge-tipo tipo-veneno">veneno</span></div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card poke-card h-100 shadow-sm">
          <div class="poke-img-wrap text-center">
            <img src="img/6.jpg" alt="Charizard">
          </div>
          <div class="card-body text-center p-2 p-sm-3">
            <div class="poke-num">#006</div>
            <h2 class="h6 mb-2">
              <a  href="DETALLES/detalle-charizard.html" class="stretched-link text-decoration-none text-dark">Charizard</a>
            </h2>
            <div class="d-flex justify-content-center flex-wrap gap-1"><span class="badge badge-tipo tipo-fuego">fuego</span><span class="badge badge-tipo tipo-volador">volador</span></div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card poke-card h-100 shadow-sm">
          <div class="poke-img-wrap text-center">
            <img src="img/7.jpg" alt="Squirtle">
          </div>
          <div class="card-body text-center p-2 p-sm-3">
            <div class="poke-num">#007</div>
            <h2 class="h6 mb-2">
              <a href="DETALLES/detalle-squirtle.html" class="stretched-link text-decoration-none text-dark">Squirtle</a>
            </h2>
            <div class="d-flex justify-content-center flex-wrap gap-1"><span class="badge badge-tipo tipo-agua">agua</span></div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card poke-card h-100 shadow-sm">
          <div class="poke-img-wrap text-center">
            <img src="img/9.png" alt="Blastoise">
          </div>
          <div class="card-body text-center p-2 p-sm-3">
            <div class="poke-num">#009</div>
            <h2 class="h6 mb-2">
              <a href="DETALLES/detalle-blastoise.html" class="stretched-link text-decoration-none text-dark">Blastoise</a>
            </h2>
            <div class="d-flex justify-content-center flex-wrap gap-1"><span class="badge badge-tipo tipo-agua">agua</span></div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card poke-card h-100 shadow-sm">
          <div class="poke-img-wrap text-center">
            <img src="img/25.jpg" alt="Pikachu">
          </div>
          <div class="card-body text-center p-2 p-sm-3">
            <div class="poke-num">#025</div>
            <h2 class="h6 mb-2">
              <a href="DETALLES/detalle-pikachu.html" class="stretched-link text-decoration-none text-dark">Pikachu</a>
            </h2>
            <div class="d-flex justify-content-center flex-wrap gap-1"><span class="badge badge-tipo tipo-electrico">eléctrico</span></div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card poke-card h-100 shadow-sm">
          <div class="poke-img-wrap text-center">
            <img src="img/133.jpg" alt="Eevee">
          </div>
          <div class="card-body text-center p-2 p-sm-3">
            <div class="poke-num">#133</div>
            <h2 class="h6 mb-2">
              <a href="DETALLES/detalle-eevee.html" class="stretched-link text-decoration-none text-dark">Eevee</a>
            </h2>
            <div class="d-flex justify-content-center flex-wrap gap-1"><span class="badge badge-tipo tipo-normal">normal</span></div>
          </div>
        </div>
      </div>
    </div>
    </main>
</body>

</html>
