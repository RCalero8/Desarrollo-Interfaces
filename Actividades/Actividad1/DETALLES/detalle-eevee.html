<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eevee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-danger sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <span class="pokeball" aria-hidden="true"></span> Pokédex
      </a>
    </div>
  </nav>

  <main class="container py-4">
    <a href="../index.html" class="btn btn-outline-secondary btn-sm mb-3">&larr; Volver a la lista</a>

    <div class="card shadow-sm border-0">
      <div class="card-body p-3 p-md-4">
        <div class="row g-4">
          <div class="col-12 col-md-5">
            <div class="detalle-hero text-center">
              <img src="../img/133.jpg" alt="Eevee">
            </div>
          </div>
          <div class="col-12 col-md-7">
            <div class="text-muted">#133</div>
            <h1 class="display-6 fw-bold mb-2">Eevee</h1>
            <div class="d-flex gap-2 mb-3"><span class="badge badge-tipo tipo-normal">normal</span></div>
            <p class="mb-4">Su código genético inestable le permite evolucionar de muchas formas según su entorno.</p>

            <div class="row g-3 mb-4 text-center">
              <div class="col-6"><div class="border rounded p-2"><div class="small text-muted">Altura</div><strong>0.3 m</strong></div></div>
              <div class="col-6"><div class="border rounded p-2"><div class="small text-muted">Peso</div><strong>6.5 kg</strong></div></div>
              <div class="col-12"><div class="border rounded p-2"><div class="small text-muted">Habilidades</div><strong>Fuga · Adaptable</strong></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
