<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blastoise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-danger sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span class="pokeball" aria-hidden="true"></span>
            </a>
        </div>
    </nav>
    <main class="container py-4">
        <a href="../index.html" class="btn btn-outline-secondary btn-sm mb-3">&larr; Volver a lista</a>
        <div class="card shadow-sm border-0">
            <div class="row g-4">
                <div class="col-12 col-md-5">
                    <div class="detalle-hero text-center">
                        <img src="../img/9.png" alt="Blastoise">
                   <div class="d-flex gap-2 mb-3"><span class="badge badge-tipo tipo-agua">agua</span></div>
            <p class="mb-4">Los cañones de su caparazón disparan chorros de agua capaces de atravesar el acero.</p>

            <div class="row g-3 mb-4 text-center">
              <div class="col-6"><div class="border rounded p-2"><div class="small text-muted">Altura</div><strong>1.6 m</strong></div></div>
              <div class="col-6"><div class="border rounded p-2"><div class="small text-muted">Peso</div><strong>85.5 kg</strong></div></div>
              <div class="col-12"><div class="border rounded p-2"><div class="small text-muted">Habilidades</div><strong>Torrente · Cura Lluvia</strong></div></div>
            </div>

            <h2 class="h5">Estadísticas base</h2>
            <div class="d-flex align-items-center gap-2 mb-2">
              <span class="stat-label">PS</span>
              <span class="stat-value">79</span>
              <div class="progress flex-grow-1" role="progressbar" aria-label="PS" aria-valuenow="79" aria-valuemin="0" aria-valuemax="160">
                <div class="progress-bar bg-warning" style="width:49.4%"></div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-2 mb-2">
              <span class="stat-label">Ataque</span>
              <span class="stat-value">83</span>
              <div class="progress flex-grow-1" role="progressbar" aria-label="Ataque" aria-valuenow="83" aria-valuemin="0" aria-valuemax="160">
                <div class="progress-bar bg-warning" style="width:51.9%"></div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-2 mb-2">
              <span class="stat-label">Defensa</span>
              <span class="stat-value">100</span>
              <div class="progress flex-grow-1" role="progressbar" aria-label="Defensa" aria-valuenow="100" aria-valuemin="0" aria-valuemax="160">
                <div class="progress-bar bg-success" style="width:62.5%"></div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-2 mb-2">
              <span class="stat-label">At. Esp.</span>
              <span class="stat-value">85</span>
              <div class="progress flex-grow-1" role="progressbar" aria-label="At. Esp." aria-valuenow="85" aria-valuemin="0" aria-valuemax="160">
                <div class="progress-bar bg-warning" style="width:53.1%"></div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-2 mb-2">
              <span class="stat-label">Def. Esp.</span>
              <span class="stat-value">105</span>
              <div class="progress flex-grow-1" role="progressbar" aria-label="Def. Esp." aria-valuenow="105" aria-valuemin="0" aria-valuemax="160">
                <div class="progress-bar bg-success" style="width:65.6%"></div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-2 mb-2">
              <span class="stat-label">Velocidad</span>
              <span class="stat-value">78</span>
              <div class="progress flex-grow-1" role="progressbar" aria-label="Velocidad" aria-valuenow="78" aria-valuemin="0" aria-valuemax="160">
                <div class="progress-bar bg-warning" style="width:48.8%"></div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-2 mt-2 pt-2 border-top">
              <span class="stat-label fw-bold">Total</span>
              <span class="fw-bold">530</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between mt-3 gap-2">
      <a class="btn btn-outline-danger btn-sm" href="detalle-squirtle.html">&larr; Squirtle</a>
      <a class="btn btn-outline-danger btn-sm" href="detalle-pikachu.html">Pikachu &rarr;</a>
    </div>
</body>

</html>
