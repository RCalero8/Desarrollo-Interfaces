<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabla de 12 columnas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .celda {
      background: #e7f1ff;
      border: 1px solid #0d6efd;
      padding: 1rem 0.25rem;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container-fluid py-4">
    <h1 class="h4 mb-3">Tabla de 12 columnas</h1>

    <!-- col-12: una debajo de otra en móvil | col-md-1: 12 columnas en una fila desde 768px -->
    <div class="row g-2">
      <div class="col-12 col-md-1"><div class="celda">1</div></div>
      <div class="col-12 col-md-1"><div class="celda">2</div></div>
      <div class="col-12 col-md-1"><div class="celda">3</div></div>
      <div class="col-12 col-md-1"><div class="celda">4</div></div>
      <div class="col-12 col-md-1"><div class="celda">5</div></div>
      <div class="col-12 col-md-1"><div class="celda">6</div></div>
      <div class="col-12 col-md-1"><div class="celda">7</div></div>
      <div class="col-12 col-md-1"><div class="celda">8</div></div>
      <div class="col-12 col-md-1"><div class="celda">9</div></div>
      <div class="col-12 col-md-1"><div class="celda">10</div></div>
      <div class="col-12 col-md-1"><div class="celda">11</div></div>
      <div class="col-12 col-md-1"><div class="celda">12</div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
