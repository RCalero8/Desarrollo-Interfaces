<div class="modal-header">
  <h4 class="modal-title">{{filmDetail?.title }}</h4>
  <button type="button" class="btn-close" aria-label="Cerrar" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  @if (filmDetail; as f) {
    <ul class="list-unstyled mb-0">
      <li><strong>Personajes:</strong> {{ f.characters }} cm</li>
      <li><strong>Director:</strong> {{ f.director }} kg</li>
      <li><strong>Creado:</strong> {{ f.created }}</li>
      <li><strong>Episodio:</strong> {{ f.episode_id}}</li>
    </ul>
  }
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="activeModal.close()">Cerrar</button>
</div>
