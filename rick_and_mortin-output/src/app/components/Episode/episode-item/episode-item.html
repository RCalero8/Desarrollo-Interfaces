<div class="card h-100 style-card">
  <div class="card-body d-flex flex-column justify-content-between">
    <div>
      <span class="badge bg-primary mb-2">{{ episode()?.episode }}</span>
      <h5 class="card-title">{{ episode()?.name }}</h5>
      <p class="card-text text-muted mb-1">
        <strong>Emisión:</strong> {{ episode()?.air_date }}
      </p>
      <p class="card-text text-muted">
        <strong>Personajes:</strong> {{ episode()?.characters?.length }}
      </p>
    </div>

    <!-- Evento click que emite el Output con el ID hacia el componente padre -->
    <button type="button" class="btn btn-primary w-100 mt-3" (click)="emitEpisodeClicked()">
      View detail
    </button>
  </div>
</div>
